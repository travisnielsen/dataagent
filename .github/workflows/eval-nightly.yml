name: Nightly Evaluation

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 6am UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  eval-nightly:
    # Run on the self-hosted private runner so we can authenticate with the
    # attached user-assigned managed identity. The Foundry evaluation engine
    # rejects federated SP tokens at the data-plane updateUpload endpoint
    # (PermissionDenied even with Owner everywhere); UAMI tokens carry the
    # claims MISE expects.
    runs-on: [self-hosted, linux, x64, cadence-private]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure (UAMI)
        uses: azure/login@v2.3.0
        with:
          auth-type: IDENTITY
          # cadence-gh-runner-id user-assigned managed identity (client ID synced from Terraform output)
          client-id: ${{ vars.EVALUATIONS_RUNNER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Replay gold dataset against Cadence API
        # Sends each gold-dataset query to the deployed backend so it emits
        # `invoke_agent` OTel spans into Application Insights. The subsequent
        # trace-eval step reads those spans.
        env:
          PYTHONPATH: src
          CADENCE_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          AZURE_AD_CLIENT_ID: ${{ vars.AZURE_AD_CLIENT_ID }}
          AZURE_CLIENT_ID: ${{ vars.EVALUATIONS_RUNNER_CLIENT_ID }}
        run: |
          uv run python -m evaluations replay \
            --dataset src/evaluations/datasets/cadence-eval-gold-v1.jsonl

      - name: Wait for App Insights trace ingestion
        # App Insights typically ingests within 30-60s; 180s gives ample buffer
        # before Foundry queries the Log Analytics workspace.
        run: sleep 180

      - name: Run full evaluation suite
        env:
          PYTHONPATH: src
          # Evaluation runner
          AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
          AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
          AZURE_FOUNDRY_EVAL_NAME: ${{ vars.AZURE_FOUNDRY_EVAL_NAME }}
          AZURE_FOUNDRY_DATASET_NAME: ${{ vars.AZURE_FOUNDRY_DATASET_NAME }}
          AZURE_FOUNDRY_DATASET_VERSION: ${{ vars.AZURE_FOUNDRY_DATASET_VERSION }}
          AZURE_CLIENT_ID: ${{ vars.EVALUATIONS_RUNNER_CLIENT_ID }}
          # Trace evaluation target — required for cluster analysis. Foundry
          # filters App Insights `invoke_agent` spans by this exact value
          # (format: `<agent-name>:<version>`, e.g. `DataAssistant:1`).
          AZURE_AI_AGENT_ID: ${{ vars.AZURE_AI_AGENT_ID }}
          AZURE_AI_TRACE_LOOKBACK_HOURS: "1"
          AZURE_AI_TRACE_MAX_TRACES: "200"
          # For evaluating SQL safety and executing queries
          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_INDEX_TABLES: ${{ secrets.AZURE_SEARCH_INDEX_TABLES }}
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          # For tracing (optional)
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: |
          uv run python -m evaluations run \
            --dataset src/evaluations/datasets/cadence-eval-gold-v1.jsonl \
            --evaluators intent_resolution,task_adherence,relevance,tool_call_accuracy \
            --trigger nightly \
            --cloud

      - name: Check for regressions and open issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultPath = '.foundry/results/latest-summary.json';
            let body = '## Nightly Evaluation Regression\n\n';
            body += `**Run date**: ${new Date().toISOString()}\n`;
            body += `**Branch**: ${process.env.GITHUB_REF}\n`;
            body += `**Commit**: ${process.env.GITHUB_SHA}\n\n`;
            if (fs.existsSync(resultPath)) {
              const summary = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
              const failing = (summary.metrics || []).filter(m => m.passed === false);
              body += '### Failing Metrics\n\n';
              for (const m of failing) {
                body += `- **${m.metric}**: ${m.mean_score.toFixed(3)} (threshold: ${m.threshold})\n`;
              }
            } else {
              body += 'Evaluation run failed — no summary generated.\n';
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Eval] Nightly regression detected — ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['evaluation', 'regression']
            });
