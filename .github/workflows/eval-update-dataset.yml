name: Eval Update Dataset

on:
  push:
    branches: [ main ]
    paths:
      - "src/backend/evaluations/datasets/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-update-dataset:
    runs-on: [ self-hosted, linux, x64, cadence-private ]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Provision datasets in Foundry
        env:
          PYTHONPATH: src/backend
          AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
        run: |
          uv run python -m evaluations.dataset_provisioner \
            --datasets-dir src/backend/evaluations/datasets
