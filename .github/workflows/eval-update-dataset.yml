name: Eval Update Dataset

on:
  push:
    branches: [main]
    paths:
      - "src/evaluations/datasets/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  eval-update-dataset:
    runs-on: [self-hosted, linux, x64, cadence-private]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Provision datasets in Foundry
        env:
          PYTHONPATH: src
          AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
        run: |
          uv run python -m evaluations.dataset_provisioner \
            --datasets-dir src/evaluations/datasets
